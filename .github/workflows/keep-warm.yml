name: keep-warm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /healthz so the Render free instance never sleeps
        run: curl --fail --silent --show-error --retry 3 --retry-delay 20 --max-time 90 https://pagerdiem.onrender.com/healthz
