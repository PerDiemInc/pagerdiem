# Create the Slack app from this manifest: https://api.slack.com/apps -> Create New App -> From a manifest.
# URLs point at the live Render service; change them if PUBLIC_URL changes.
display_information:
  name: PagerDiem
  description: Weekend on-call rotation and paging for Per Diem engineering
  background_color: "#e8492b"
features:
  bot_user:
    display_name: PagerDiem
    always_online: true
  slash_commands:
    - command: /oncall
      url: https://pagerdiem.onrender.com/slack/commands
      description: Who's on call now and the next weekends
      should_escape: false
    - command: /page
      url: https://pagerdiem.onrender.com/slack/commands
      description: Page whoever is on call
      usage_hint: "[what is broken]"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - commands
      - im:write
      - users:read
      - users:read.email
settings:
  interactivity:
    is_enabled: true
    request_url: https://pagerdiem.onrender.com/slack/interactions
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
