# Render Blueprint: dashboard.render.com -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: pagerdiem
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: API_TOKEN
        generateValue: true
      - key: DATABASE_URL        # Neon Postgres connection string (asked for when you create the Blueprint)
        sync: false
      - key: GOOGLE_CLIENT_ID      # Google sign-in, limited to ALLOWED_EMAIL_DOMAINS
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ALLOWED_EMAIL_DOMAINS   # your company's email domain, e.g. example.com
        sync: false
      - key: TEAM_NAME
        sync: false
      - key: TEAM_TIMEZONE
        value: America/New_York
      - key: SHIFT_START
        value: FRI 18:00
      - key: SHIFT_END
        value: MON 09:00
      # Slack keys: add them later under Environment in the Render dashboard.
